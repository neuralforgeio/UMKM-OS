services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-umkmos}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umkm} -d ${POSTGRES_DB:-umkmos}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # One-shot job: applies migrations and seeds demo data inside the
  # docker network. Reuses the cached builder stage of the frontend
  # image, so a plain "docker compose up" needs no host Node at all.
  migrate:
    build:
      context: ./frontend
      target: builder
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-umkm}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-umkmos}"
      # Akun developer bootstrap — nilai asli hanya di root .env (ter-gitignore).
      DEV_SEED_EMAIL: ${DEV_SEED_EMAIL:-}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      DEBUG: "false"
      DATABASE_URL: "postgresql+psycopg_async://${POSTGRES_USER:-umkm}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-umkmos}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Only active with "docker compose watch": saving any backend file
    # rebuilds and restarts this service automatically. Inert during
    # normal compose up, so the demo flow is untouched.
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - .venv
            - __pycache__
            - .pytest_cache

  frontend:
    build: ./frontend
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: "postgresql://${POSTGRES_USER:-umkm}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-umkmos}"
      BACKEND_URL: "http://backend:8000"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules
            - .next
            - .env
            - .env.local

volumes:
  pgdata:
