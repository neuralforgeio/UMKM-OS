# =====================================================================
# UMKM OS — full stack dalam SATU perintah:  docker compose up --build
#
# ERA GO MURNI (backend 2.0.0): layanan Python era lama
# (REST API + Prophet) sudah DIHAPUS. Folder Go lama di-rename
# menjadi `backend` dan kini menjadi SATU-SATUNYA backend:
#
#   db       : PostgreSQL 18           -> host 5433 (tidak bentrok PG lokal 5432)
#   backend  : REST API Go             -> host 8080 (login, kasir POS,
#              produk/stok per outlet (SKU unik per outlet), transaksi,
#              laporan dashboard, audit ber-IP + geo, OSCAR asisten AI
#              dwi-mode (Groq), OSCAR Developer AI ber-PIN + pelaporan
#              proaktif, ramalan statistik — migrasi berjalan saat boot,
#              unittest dijalankan DI DALAM docker build)
#   frontend : Next.js                 -> host 3000 (UI)
#
# Seluruh nilai sensitif datang dari root .env (salin dari .env.example)
# — tidak ada satu pun kredensial yang ditulis di file ini.
#
# Volume `aidata` menggantikan volume model era Python: rumah bagi
# llm_config.json (pengaturan OSCAR dari UI, menimpa env tanpa
# restart), dev_config.json (PIN developer), dan dev_reports.json
# (laporan proaktif).
# =====================================================================

services:
  db:
    image: postgres:18-alpine
    environment:
      TZ: Asia/Jakarta
      POSTGRES_USER: ${POSTGRES_USER:-umkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-umkmos}
    # timezone eksplisit supaya CURRENT_DATE / to_char di query laporan
    # mengikuti hari Jakarta, sama seperti PostgreSQL lokal (WIB).
    command: ["postgres", "-c", "timezone=Asia/Jakarta"]
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    # v1.1.1 "healthcheck tenang": BOOT tetap cepat (probe tiap 2 detik
    # selama 30 detik pertama lewat start_interval) tetapi keadaan stabil
    # hanya diperiksa tiap 60 detik - tidak lagi setiap 5 detik sepanjang
    # hari. pg_isready tidak menulis log apa pun, jadi ini murni soal
    # memberi napas pada laptop.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umkm} -d ${POSTGRES_DB:-umkmos}"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  # REST API Go — SATU-SATUNYA backend (era Go murni): pemeriksa
  # kredensial + pemilik schema kasir/laporan/audit + rumah baru OSCAR
  # (asisten AI, AI Developer, ramalan statistik). Migrasi schema &
  # seed akun berjalan saat boot; `go vet` + seluruh unittest dijalankan
  # DI DALAM docker build — image hanya terpasang bila tes lolos, jadi
  # setelah service healthy seluruh tabel siap dan perilaku teruji.
  backend:
    build: ./backend
    environment:
      TZ: Asia/Jakarta
      PORT: "8080"
      # CORS mengikuti port frontend di sisi HOST (browser selalu datang
      # dari localhost). Panggilan server-ke-server dalam jaringan
      # docker memakai http://backend:8080 dan tidak lewat CORS.
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-3000}
      DATABASE_URL: "postgres://${POSTGRES_USER:-umkm}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-umkmos}?sslmode=disable"
      # Satu secret root untuk dua penanda: cookie sesi NextAuth (AUTH_
      # SECRET) dan token JWT backend — rotasi cukup satu tempat di
      # root .env. Kalau kelak ingin terpisah, tambahkan baris
      # JWT_SECRET=... di root .env lalu ganti nilai ini jadi ${JWT_SECRET}.
      JWT_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      JWT_EXPIRES_H: "24"
      # Akun owner awal (opsional): tanpa OWNER_PASSWORD, Go mencetak
      # password acak 16 karakter SEKALI di `docker compose logs backend`
      # saat database pertama kali dibuat.
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@umkm.local}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      # SINKRON kredensial developer: DEV_SEED_* dari root .env yang sama
      # dipakai backend untuk akun developer-nya (login konsol dev).
      DEVELOPER_EMAIL: ${DEV_SEED_EMAIL:-}
      DEVELOPER_PASSWORD: ${DEV_SEED_PASSWORD:-}
      LOG_DIR: logs
      # ===== ERA GO MURNI: OSCAR + AI Developer (eks layanan Python) =====
      # Konfigurasi LLM (env adalah fallback; llm_config.json di volume
      # aidata MENIMPA env tanpa restart — diatur dari UI Pengaturan).
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      # RUN-5: rantai model cadangan — bila model utama ditolak Groq
      # (HTTP 403: diblokir izin organisasi/project di console.groq.com/
      # settings/limits, atau 404: model dimatikan), OSCAR otomatis turun
      # ke cadangan berikutnya supaya tetap menjawab. Llama era lama
      # (3.1/3.3) kini enterprise-only sehingga tidak dipakai.
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-openai/gpt-oss-120b,qwen/qwen3.8-27b}
      # Batas laju asisten per pemilik (default 12/jam) + TTL cache
      # jawaban (default 600 detik) + batas laporan developer (6/jam).
      ASSISTANT_RATE_LIMIT_PER_HOUR: ${ASSISTANT_RATE_LIMIT_PER_HOUR:-12}
      ASSISTANT_CACHE_SECONDS: ${ASSISTANT_CACHE_SECONDS:-600}
      DEV_AI_RATE_LIMIT_PER_HOUR: ${DEV_AI_RATE_LIMIT_PER_HOUR:-6}
      # Geo lookup kota asal IP di jejak audit (bisa dimatikan untuk
      # nol trafik keluar).
      GEO_LOOKUP_ENABLED: ${GEO_LOOKUP_ENABLED:-true}
      # Gerbang antar-layanan BAB 5.4: default = AUTH_SECRET root
      # (satu tempat rotasi); frontend memakai nilai yang sama.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-${AUTH_SECRET}}
      # Volume data AI: llm_config.json + dev_config.json + dev_reports.json.
      AI_DATA_DIR: /app/aidata
    ports:
      - "8080:8080"
    volumes:
      # Log harian .log + .csv bertahan lintas rebuild container.
      - gologs:/app/logs
      # Konfigurasi OSCAR + laporan developer bertahan lintas rebuild.
      - aidata:/app/aidata
    # v1.1.1 "healthcheck tenang" (permintaan pemilik: backend jangan
    # selalu fetch /health karena memberatkan laptop): blok ini MENIMPA
    # HEALTHCHECK Dockerfile. Keadaan stabil diperiksa tiap 60 detik
    # (dulu 10 detik); BOOT tetap cepat karena start_interval menjalankan
    # probe tiap 3 detik selama 30 detik pertama. Probe juga tidak lagi
    # menulis baris log (middleware Logger), jadi volume gologs di
    # Windows tidak dipukul tulisan kecil sepanjang hari.
    # Catatan: start_interval butuh Docker Engine 25+ (Docker Desktop
    # zaman compose v5 sudah jauh melewatinya).
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 3s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Only active with "docker compose watch": saving any backend file
    # rebuilds and restarts this service automatically. Inert during
    # normal compose up, so the demo flow is untouched.
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - logs
            - .env
            - aidata

  frontend:
    build: ./frontend
    environment:
      TZ: Asia/Jakarta
      HOSTNAME: 0.0.0.0
      # Di dalam jaringan docker, frontend memanggil service lain lewat
      # NAMA service (bukan localhost). Token Go tidak pernah sampai ke
      # browser — semua panggilan dilakukan server-side. Frontend TIDAK
      # punya kredensial database sejak v2.1.0 (era Go murni).
      # ERA GO MURNI: BACKEND_URL kini menunjuk backend GO (:8080) —
      # pintu /api/v1/assistant/* dan /api/v1/forecast/* dilayani
      # langsung oleh backend Go dengan kontrak JSON yang sama.
      API_URL: http://backend:8080
      BACKEND_URL: http://backend:8080
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      # Gerbang antar-layanan OSCAR (harus SAMA dengan service backend
      # di atas — default mewarisi AUTH_SECRET root).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-${AUTH_SECRET}}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules
            - .next
            - .env
            - .env.local

volumes:
  pgdata:
  gologs:
  aidata:
